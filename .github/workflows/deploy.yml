name: Deploy Cloud Function

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ID_DO_SEU_PROJETO
          workload_identity_provider: PROVIDER_DO_WORKLOAD_IDENTITY
          service_account: SERVICE_ACCOUNT_DO_CI_CD

      - name: Setup Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Deploy Cloud Function
        run: |
          gcloud functions deploy LoanHandlerPubSub \
            --gen2 \
            --runtime=go124 \
            --region=us-central1 \
            --project=project-ab4fa986-e441-43f4-9fe \
            --entry-point=LoanHandler \
            --trigger-topic=orders
